<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Scripts</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: white;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 20% 20%, rgba(0,255,120,.15), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(0,180,255,.12), transparent 30%),
        linear-gradient(135deg, #050807, #0b1510, #050807);
    }

    /* ÁNH SÁNG NỀN */

    body::before {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      background: #00ff88;
      filter: blur(180px);
      opacity: .08;
      top: -150px;
      left: -150px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      background: #0088ff;
      filter: blur(180px);
      opacity: .06;
      bottom: -150px;
      right: -150px;
      pointer-events: none;
    }

    /* CONTAINER */

    .container {
      width: 92%;
      max-width: 560px;
      margin: 60px auto;

      background: rgba(12, 20, 16, .82);
      backdrop-filter: blur(18px);

      border: 1px solid rgba(57,255,136,.18);
      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 20px 70px rgba(0,0,0,.5),
        0 0 40px rgba(0,255,120,.05);
    }

    /* TITLE */

    h1 {
      text-align: center;
      margin: 0 0 30px;

      font-size: 30px;

      background: linear-gradient(
        90deg,
        #39ff88,
        #8affbd,
        #39ff88
      );

      -webkit-background-clip: text;
      color: transparent;

      text-shadow: 0 0 25px rgba(57,255,136,.2);
    }

    /* GAME CARD */

    .game {
      position: relative;

      background:
        linear-gradient(
          135deg,
          rgba(35,55,43,.9),
          rgba(13,25,18,.95)
        );

      border: 1px solid rgba(57,255,136,.15);

      padding: 20px;

      border-radius: 16px;

      cursor: pointer;

      transition: .3s;

      overflow: hidden;
    }

    .game::before {
      content: "";

      position: absolute;
      top: 0;
      left: -100%;

      width: 100%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(57,255,136,.12),
        transparent
      );

      transition: .5s;
    }

    .game:hover::before {
      left: 100%;
    }

    .game:hover {
      transform: translateY(-4px);

      border-color: #39ff88;

      box-shadow:
        0 10px 35px rgba(57,255,136,.12),
        inset 0 0 20px rgba(57,255,136,.04);
    }

    .game-title {
      font-size: 21px;
      font-weight: bold;
      color: #fff;
    }

    .game-subtitle {
      color: #8d9d93;
      margin-top: 7px;
      font-size: 14px;
    }

    /* GAME ICON */

    .game-icon {
      float: right;

      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: rgba(57,255,136,.1);

      font-size: 22px;

      box-shadow:
        0 0 20px rgba(57,255,136,.08);
    }

    /* SCRIPT PAGE */

    .scripts {
      display: none;
    }

    .back {
      display: inline-block;

      color: #55ff99;

      cursor: pointer;

      margin-bottom: 20px;

      font-size: 14px;

      transition: .2s;
    }

    .back:hover {
      color: white;
      transform: translateX(-3px);
    }

    /* SCRIPT CARD */

    .script-card {
      background:
        linear-gradient(
          145deg,
          rgba(27,43,33,.9),
          rgba(10,17,13,.95)
        );

      border: 1px solid rgba(57,255,136,.18);

      padding: 20px;

      border-radius: 18px;

      box-shadow:
        inset 0 0 30px rgba(57,255,136,.025);
    }

    .script-name {
      font-size: 21px;
      font-weight: bold;

      margin-bottom: 15px;

      color: #65ff9f;
    }

    /* CODE */

    .code-box {
      background: #050806;

      border: 1px solid #17231b;

      padding: 17px;

      border-radius: 12px;

      overflow-x: auto;

      margin-bottom: 14px;

      box-shadow:
        inset 0 0 25px rgba(0,0,0,.6);
    }

    code {
      color: #b9ffce;

      font-size: 13px;

      line-height: 1.6;

      white-space: pre-wrap;

      word-break: break-word;
    }

    /* BUTTON */

    button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #39ff88,
          #20d96c
        );

      color: #041008;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: .25s;

      box-shadow:
        0 8px 25px rgba(57,255,136,.15);
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 35px rgba(57,255,136,.25);
    }

    button:active {
      transform: scale(.98);
    }

    /* COPY MESSAGE */

    #message {
      text-align: center;

      color: #55ff99;

      margin-top: 12px;

      display: none;

      font-size: 14px;

      animation: fade .25s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FOOTER */

    .footer {
      text-align: center;

      margin-top: 25px;

      color: #59665e;

      font-size: 12px;
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- GAME LIST -->

    <div id="gameList">

      <h1>🎮 Game Scripts</h1>

      <div class="game" onclick="openGame()">

        <div class="game-icon">
          🎯
        </div>

        <div class="game-title">
          Steal an Egg
        </div>

        <div class="game-subtitle">
          Click để xem các script
        </div>

      </div>

      <div class="footer">
        Game Script Hub
      </div>

    </div>


    <!-- SCRIPT LIST -->

    <div class="scripts" id="scriptList">

      <div class="back" onclick="goBack()">
        ← Quay lại
      </div>

      <h1>Steal an Egg</h1>

      <div class="script-card">

        <div class="script-name">
          ⚡ Chilli Hub
        </div>

        <div class="code-box">

          <code id="scriptCode">loadstring(game:HttpGet("https://raw.githubusercontent.com/baoacff-beep/Chilli/refs/heads/main/Chilli.lua"))()</code>

        </div>

        <button onclick="copyScript()">
          📋 Copy Script
        </button>

        <div id="message">
          ✓ Đã copy script!
        </div>

      </div>

    </div>

  </div>


  <script>

    const scriptText =
      'loadstring(game:HttpGet("https://raw.githubusercontent.com/baoacff-beep/Chilli/refs/heads/main/Chilli.lua"))()';


    function openGame() {

      document.getElementById("gameList").style.display = "none";

      document.getElementById("scriptList").style.display = "block";

    }


    function goBack() {

      document.getElementById("scriptList").style.display = "none";

      document.getElementById("gameList").style.display = "block";

    }


    function copyScript() {

      navigator.clipboard.writeText(scriptText).then(() => {

        const message =
          document.getElementById("message");

        message.style.display = "block";

        setTimeout(() => {

          message.style.display = "none";

        }, 2000);

      });

    }

  </script>

</body>
</html>
